replicaCount: 1

image:
  repository: mierule7/opspilot-app
  pullPolicy: IfNotPresent
  tag: "v1"

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

env:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://opspilot-db-postgresql:5432/opspilot_db"
  SPRING_DATASOURCE_USERNAME: "opspilot_user"
  SPRING_DATASOURCE_PASSWORD: "opspilot_password"