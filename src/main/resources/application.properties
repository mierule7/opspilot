# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/opspilot_db
spring.datasource.username=opspilot_user
spring.datasource.password=opspilot_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# JWT Configuration
# Note: In production, this should be an environment variable, but hardcoded is fine for now.
opspilot.app.jwtSecret=9a4f2c8d3b7a1e5f8g2h6j4k8m0n2p4q6r8s0t2v4w6x8y0z2a4b6c8d0e2f4g6h8i0j
opspilot.app.jwtExpirationMs=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=opspilot-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=opspilot
spring.rabbitmq.password=opspilot123

# Kafka Configuration
spring.kafka.bootstrap-servers=opspilot-kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=opspilot-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer